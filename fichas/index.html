<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha de propiedad · PRIZMA Brokers</title>
<meta property="og:title" content="Ficha de propiedad · PRIZMA Brokers">
<meta property="og:description" content="Te comparto esta propiedad seleccionada para vos.">
<meta property="og:image" content="https://pabloaprop-prog.github.io/leads/fichas/preview.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#14161B">
<style>
  html, body { margin: 0; height: 100%; background: #14161B; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .msg { color: #fff; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 40px 20px; }
</style>
</head>
<body>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbzv4lpvn7zZuDfRkoAw6ygYLvYNHya2vRyh6uc-YaM4gpNZI7EwJ9Kwq7FVDLOGSNfj/exec';
  var id = new URLSearchParams(location.search).get('id');
  if (id && /^[a-z0-9]{6,20}$/i.test(id)) {
    var f = document.createElement('iframe');
    f.src = APP + '?id=' + encodeURIComponent(id);
    f.title = 'Ficha de propiedad';
    f.setAttribute('allow', 'clipboard-write');
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="msg">Ficha no encontrada.</div>';
  }
</script>
</body>
</html>
